name: Run checks

on:
  push:
  pull_request:

jobs:
  luacheck:
    runs-on: ubuntu-latest
    if: |
      github.event_name == 'push' ||
      github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.full_name != github.repository
    steps:
      - uses: actions/checkout@master

      # luacheck needs neither Tarantool nor tt: .luacheckrc declares the
      # globals of Tarantool itself.
      - name: Setup luacheck
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends luarocks
          sudo luarocks install luacheck 0.25.0

      - name: Run luacheck
        run: luacheck .

  golangci-lint:
    runs-on: ubuntu-latest
    if: |
      github.event_name == 'push' ||
      github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.full_name != github.repository
    steps:
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'

      - uses: actions/checkout@v4

      - name: golangci-lint
        uses: golangci/golangci-lint-action@v7
        with:
          version: v2.12.2
          args: --config=.golangci-lint.yaml

  codespell:
    runs-on: ubuntu-latest
    if: |
      github.event_name == 'push' ||
      github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.full_name != github.repository
    steps:
      - uses: actions/checkout@master

      - name: Install codespell
        run: pip3 install codespell

      - name: Run codespell
        run: codespell
